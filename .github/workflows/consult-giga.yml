name: Consult Giga Chat

on:
  workflow_dispatch:
    inputs:
      text:
        description: Текст сообщения клиента
        required: true
      chat_id:
        description: ID чата MAX для ответа
        required: true
      sender_name:
        description: Имя отправителя
        required: false
        default: "клиент"

jobs:
  answer:
    runs-on: ubuntu-latest
    steps:
      - name: GigaChat answer -> MAX
        env:
          GIGA_SECRET: ${{ secrets.GIGA_SECRET }}
          MAX_TOKEN: ${{ secrets.MAX_TOKEN }}
          MAX_CHAT: ${{ secrets.MAX_CHAT_ID }}
          TEXT: ${{ github.event.inputs.text }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          SENDER: ${{ github.event.inputs.sender_name }}
        run: |
          set -e
          python3 - <<'PY'
import os, json, urllib.request, uuid, ssl

giga_secret = os.environ["GIGA_SECRET"]
max_token = os.environ["MAX_TOKEN"]
max_chat = os.environ["MAX_CHAT"]
text = os.environ["TEXT"]
chat_id = os.environ["CHAT_ID"]
sender = os.environ.get("SENDER", "клиент")

KB = """СТУДИЯ АРТЁМА РАЙХЕРТА: автоматизация каналов и продуктов.
УСЛУГИ И ЦЕНЫ (вилки, детали в смете):
1) Ведение каналов: 10-25 тыс/мес за площадку; связка 8 площадок 50-90 тыс/мес.
2) Стратегия: аудит 8-15 тыс; стратегия 30-60 тыс; с сопровождением 90-150 тыс.
3) Автоматизация: конвейер публикаций, комментарии, отчёты. Сценарий от 10 тыс; конвейер 15-40 тыс; поддержка 5-12 тыс/мес.
4) Сайты: лендинг 60-120 тыс; корпоративный 150-500 тыс; каталог от 500 тыс; веб-сервис от 800 тыс.
5) Документы, презентации, аналитика. 6) Android (RuStore): простое 2-4 недели, MVP от 1,5 мес. 7) РСЯ.
СРОКИ: презентация 2-5 дней; ведение старт 3-5 дней; автоматизация 1-3 недели.
КЕЙСЫ: радио «Деревенский шансон» RuStore; Дзен «Митрофановна» 58k; VK группа; YouTube 55.9k подписчиков.
ПРАВИЛА: отвечай от «мы», коротко, тепло, по делу. Цены — вилки из базы. Предлагай бесплатный аудит канала (15 минут). Не выдумывай цены и сроки. iOS не делаем."""

# OAuth GigaChat
def giga_answer(user_text):
    ctx_ = ssl.create_default_context()
    ctx_.check_hostname = False
    ctx_.verify_mode = ssl.CERT_NONE
    data = urllib.parse.urlencode({"scope": "GIGACHAT_API_PERS"}).encode()
    req = urllib.request.Request("https://ngw.devices.sberbank.ru:9443/api/v2/oauth",
        data=data, method="POST", headers={
            "Authorization": "Basic " + giga_secret,
            "Content-Type": "application/x-www-form-urlencoded",
            "Accept": "application/json",
            "RqUID": str(uuid.uuid4()),
            "User-Agent": "rayhert-consult/1.0"})
    with urllib.request.urlopen(req, timeout=60, context=ctx_) as r:
        tok = json.loads(r.read().decode())["access_token"]
    payload = {
        "model": "GigaChat-2-Max",
        "messages": [
            {"role": "system", "content": "Ты — консультант студии Артёма Райхерта. Отвечай по-русски живым языком, от «мы», кратко, по делу, тепло. База знаний:\n" + KB},
            {"role": "user", "content": user_text}
        ],
        "temperature": 0.6,
        "max_tokens": 600
    }
    req2 = urllib.request.Request("https://gigachat.devices.sberbank.ru/api/v1/chat/completions",
        data=json.dumps(payload).encode(), method="POST",
        headers={"Authorization": "Bearer " + tok, "Content-Type": "application/json", "Accept": "application/json"})
    with urllib.request.urlopen(req2, timeout=90, context=ctx_) as r:
        d = json.loads(r.read().decode())
        return d["choices"][0]["message"]["content"].strip()

answer = giga_answer(text)

# Отправка в MAX токеном бота-консультанта
ctx_ssl = ssl.create_default_context(); ctx_ssl.check_hostname = False; ctx_ssl.verify_mode = ssl.CERT_NONE
url = "https://platform-api.max.ru/messages?chat_id=" + urllib.parse.quote(str(chat_id))
req3 = urllib.request.Request(url, data=json.dumps({"text": answer}).encode(), method="POST",
    headers={"Authorization": max_token, "Content-Type": "application/json"})
with urllib.request.urlopen(req3, timeout=30, context=ctx_ssl) as r:
    print("MAX send", r.status)
print("ANSWER:", answer[:80])
PY
