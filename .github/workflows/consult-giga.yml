name: Consult Giga Chat

on:
  workflow_dispatch:
    inputs:
      text:
        description: Текст сообщения клиента
        required: true
      chat_id:
        description: ID чата MAX
        required: true
      sender_name:
        description: Имя отправителя
        required: false
        default: клиент

permissions:
  contents: read
  actions: write

jobs:
  answer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: GigaChat answer to MAX
        env:
          GIGA_SECRET: ${{ secrets.GIGA_SECRET }}
          CONSULT_MAX_TOKEN: ${{ secrets.CONSULT_MAX_TOKEN }}
          TEXT: ${{ github.event.inputs.text }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
        run: python3 .github/consult_answer.py
      - name: Запустить снапшот канала для аудита
        if: ${{ startsWith(github.event.inputs.text, 'URL:') }}
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_URL: ${{ github.event.inputs.text }}
          AUDIT_CHAT: ${{ github.event.inputs.chat_id }}
        run: |
          URL="${AUDIT_URL#URL: }"
          gh workflow run snapshot-audit.yml -f "url=$URL" -f "chat_id=$AUDIT_CHAT"

      - name: Записать контакт клиента (аудит канала)
        if: ${{ startsWith(github.event.inputs.text, 'URL:') }}
        env:
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          CONTACT_SOURCE: аудит
          SENDER_NAME: ${{ github.event.inputs.sender_name }}
          PLATFORM: ""
          CHANNEL_URL: ${{ github.event.inputs.text }}
          CONTACT_STATUS: аудит-запрошен
          NEXT_STEP: проведён аудит канала
          HISTORY: запрос бесплатного аудита
        run: python3 .github/scripts/call_contacts_webapp.py
