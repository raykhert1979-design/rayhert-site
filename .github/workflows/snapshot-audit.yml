name: Snapshot канала для аудита

on:
  workflow_dispatch:
    inputs:
      url:
        description: Ссылка на канал (YouTube/Rutube/VK/Дзен/Telegram)
        required: true
      chat_id:
        description: ID чата MAX, куда прислать результат
        required: true

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Установить yt-dlp
        run: |
          pip install --quiet yt-dlp

      - name: Снять снапшот канала
        id: snap
        env:
          URL: ${{ github.event.inputs.url }}
        run: |
          python3 .github/scripts/channel_snapshot.py "$URL" > snapshot.json || echo "::warning::Снапшот не удался"
          echo "result=готово" >> "$GITHUB_OUTPUT"

      - name: Записать контакт клиента (после аудита)
        if: always()
        env:
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          CONTACT_SOURCE: аудит
          SENDER_NAME: ""
          PLATFORM: ""
          CHANNEL_URL: ${{ github.event.inputs.url }}
          CONTACT_STATUS: аудит-получен
          NEXT_STEP: ждём ответа клиента на предложение
          HISTORY: аудит отправлен клиенту в MAX
          CONTACTS_KEY: ${{ secrets.CONTACTS_KEY }}
        run: python3 .github/scripts/call_contacts_webapp.py

      - name: Отправить результат в MAX
        if: always()
        env:
          CONSULT_MAX_TOKEN: ${{ secrets.CONSULT_MAX_TOKEN }}
          MAX_TOKEN: ${{ secrets.MAX_TOKEN }}
          GIGA_SECRET: ${{ secrets.GIGA_SECRET }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          OWNER_CHAT_ID: ${{ secrets.MAX_CHAT_ID }}
        run: python3 .github/scripts/snapshot_send.py
